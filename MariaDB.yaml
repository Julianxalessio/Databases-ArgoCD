# ============================================================
# Namespace
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: database-namespace

---
# ============================================================
# Secret
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
  namespace: database-namespace
type: Opaque
stringData:
  root-password: "BBZbl12345!"

---
# ============================================================
# PersistentVolumeClaim
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: database-namespace
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# ============================================================
# Service
# MariaDB bleibt von außen erreichbar
# 144.24.232.203:10001 -> 3306
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
  namespace: database-namespace
spec:
  selector:
    app: mariadb
  type: LoadBalancer
  loadBalancerIP: 144.24.232.203
  ports:
    - protocol: TCP
      port: 10001
      targetPort: 3306

---
# ============================================================
# MariaDB Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb-deployment
  namespace: database-namespace
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mariadb

  template:
    metadata:
      labels:
        app: mariadb

    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8.8-ubi9

          ports:
            - containerPort: 3306

          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: root-password

            - name: MARIADB_DATABASE
              value: "test"

          volumeMounts:
            - name: mariadb-storage
              mountPath: /var/lib/mysql

      volumes:
        - name: mariadb-storage
          persistentVolumeClaim:
            claimName: mariadb-pvc

---
# ============================================================
# Job
# Führt tatsächlich mariadb-secure-installation aus
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: mariadb-secure-installation
  namespace: database-namespace
spec:
  backoffLimit: 10

  template:
    spec:
      restartPolicy: OnFailure

      containers:
        - name: secure-installation
          image: mariadb:11.8.8-ubi9

          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: root-password

          command:
            - /bin/sh
            - -c
            - |
              echo "Warte auf MariaDB..."

              until mariadb \
                -h mariadb-service \
                -P 10001 \
                -u root \
                -p"${MARIADB_ROOT_PASSWORD}" \
                -e "SELECT 1" >/dev/null 2>&1
              do
                sleep 5
              done

              echo "MariaDB ist verfügbar."
              echo "Starte mariadb-secure-installation..."
              
              # Because it is non-interactive add pre-defined answers to the prompts
              printf '%s\n' \
                "${MARIADB_ROOT_PASSWORD}" \
                "n" \
                "Y" \
                "Y" \
                "Y" \
                "Y" \
              | mariadb-secure-installation \
                -h mariadb-service \
                -P 3306 \
                -u root \
                -p"${MARIADB_ROOT_PASSWORD}"

              echo "mariadb-secure-installation abgeschlossen."